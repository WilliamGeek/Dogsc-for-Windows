<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>DogSC Studio</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%231b1b1a'/%3E%3Ccircle cx='16' cy='16' r='8' fill='%23da7a52'/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="/web/studio/styles.css" />
</head>
<body>
  <div class="studio-shell" id="studio-root">
    <!-- 1. Top Chrome Bar (44px, aligned with EditorChromeMetrics.titleBarHeight) -->
    <header class="chrome-bar">
      <div class="chrome-group">
        <div class="brand-mark">
          <span class="brand-dot"></span>
          <span>DogSC Studio</span>
        </div>
        <select id="recording-picker" class="chrome-select" aria-label="选择录制"></select>
        <button id="btn-new-record" class="chrome-btn subtle-well" title="新建屏幕/窗口/音视频录制">
          <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" fill="var(--recording-red)" stroke="none"/></svg>
          <span>新建录制</span>
        </button>
        <button id="btn-toggle-library" class="chrome-btn active" title="展开/收起左侧 AI 与素材库 (Ctrl+Alt+L)">
          <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M9 4v16"/></svg>
          <span>AI · 素材库</span>
        </button>
        <input id="project-title-input" class="chrome-title-input" type="text" placeholder="工程标题" aria-label="工程标题" />
        <span id="save-status-pill" class="save-pill">就绪</span>
      </div>

      <div class="chrome-group">
        <button id="btn-undo" class="chrome-btn" disabled title="撤销 (Ctrl+Z)">
          <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          <span>撤销</span>
        </button>
        <button id="btn-redo" class="chrome-btn" disabled title="重做 (Ctrl+Y)">
          <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 14 5-5-5-5"/><path d="M20 9H9.5a5.5 5.5 0 0 0 0 11H13"/></svg>
          <span>重做</span>
        </button>
        <button id="btn-shortcuts-help" class="chrome-btn" title="键盘快捷键速查 (?)">
          <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="5" width="20" height="14" rx="2.5"/><path d="M6 10h.01M10 10h.01M14 10h.01M18 10h.01M7 14h10"/></svg>
          <span>快捷键</span>
        </button>
        <button id="btn-theme-toggle" class="chrome-btn" title="切换深色/浅色主题">
          <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32 1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
          <span>浅色</span>
        </button>
        <button id="btn-open-export" class="primary-export-btn">
          <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.85" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12"/><path d="m7 8 5-5 5 5"/><path d="M5 14v5a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-5"/></svg>
          <span>导出</span>
        </button>
      </div>
    </header>

    <!-- 2. Middle Workspace: Collapsible Left Library + Central WebGL2 Monitor + Right Inspector -->
    <main id="workspace-mid" class="workspace-mid">
      <aside id="studio-library-shell" class="library-shell" aria-label="AI 助手与素材库">
        <div class="library-header">
          <div id="studio-library-tabs" class="library-tabs" role="tablist">
            <button class="lib-tab-btn active" data-lib-tab="ai" role="tab" aria-selected="true">AI 助手</button>
            <button class="lib-tab-btn" data-lib-tab="assets" role="tab" aria-selected="false">素材库</button>
            <button class="lib-tab-btn" data-lib-tab="subtitles" role="tab" aria-selected="false">字幕</button>
            <button class="lib-tab-btn" data-lib-tab="motion" role="tab" aria-selected="false">动效</button>
          </div>
          <button id="btn-collapse-library" class="tbtn lib-collapse-btn" title="收起左侧面板 (Ctrl+Alt+L)">
            <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
          </button>
        </div>
        <div id="studio-library-body" class="library-body"></div>
      </aside>
      <section class="stage-column">
        <div class="stage-viewport">
          <div class="stage-canvas-wrap" id="stage-canvas-wrap">
            <canvas id="studio-stage" width="1280" height="720"></canvas>
            <div id="stage-focus-hint" class="stage-hint-pill">点击画面可直接重设当前缩放焦点</div>
            <div id="focus-target-marker" class="focus-target-marker"></div>
            <div id="stage-crop-overlay" class="stage-crop-overlay" aria-hidden="true"></div>
          </div>
        </div>

        <!-- Monitor Transport Bar + 3px Terracotta Scrub Progress -->
        <div class="monitor-bar-wrap">
          <div class="monitor-progress-track" id="monitor-progress-track" title="点击或拖动跳转播放头">
            <div class="monitor-progress-rail">
              <div class="monitor-progress-fill" id="monitor-progress-fill"></div>
            </div>
          </div>

          <div class="monitor-bar">
            <div class="transport-cluster">
              <div class="segmented-well" id="quick-ratio-switch" aria-label="快速画布比例">
                <button class="seg-opt active" data-ratio="适应">适应</button>
                <button class="seg-opt" data-ratio="16:9">16:9</button>
                <button class="seg-opt" data-ratio="9:16">9:16</button>
                <button class="seg-opt" data-ratio="1:1">1:1</button>
              </div>
              <button id="btn-toggle-crop" class="chrome-btn" title="拖拽画布交互式裁剪源画面区域">
                <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2v14a2 2 0 0 0 2 2h14"/><path d="M18 22V8a2 2 0 0 0-2-2H2"/></svg>
                <span>裁剪</span>
              </button>
            </div>

            <div class="transport-cluster">
              <button id="btn-step-back" class="tbtn" title="上一帧 (←)">
                <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6v12"/><path d="M17 6 9 12l8 6V6Z" fill="currentColor" stroke="none"/></svg>
              </button>
              <button id="btn-play-toggle" class="play-disc-btn" title="播放 / 暂停 (Space)">
                <svg class="ico" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" aria-hidden="true"><path d="m7 5 12 7-12 7V5Z" fill="currentColor" stroke="none"/></svg>
              </button>
              <button id="btn-step-fwd" class="tbtn" title="下一帧 (→)">
                <svg class="ico" width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6v12"/><path d="M7 6l8 6-8 6V6Z" fill="currentColor" stroke="none"/></svg>
              </button>
              <span class="timecode-readout">
                <strong id="tc-current">00:00.00</strong> / <span id="tc-total">00:00.00</span>
              </span>
            </div>

            <div class="transport-cluster">
              <select id="preview-speed-select" class="chrome-select" aria-label="预览倍速" style="height:26px;">
                <option value="0.5">0.5×</option>
                <option value="1" selected>1×</option>
                <option value="1.5">1.5×</option>
                <option value="2">2×</option>
              </select>
              <div class="segmented-well" id="quality-mode-toggle" aria-label="预览质量">
                <button class="seg-opt active" data-quality="low">流畅</button>
                <button class="seg-opt" data-quality="full">原画</button>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Right Inspector Drawer + 48px Vertical Icon Rail -->
      <aside class="inspector-shell">
        <div id="studio-inspector-body" class="inspector-body"></div>
        <nav class="inspector-rail" id="studio-inspector-rail" aria-label="检查器分类">
          <button class="rail-tab-btn active" data-tab="frame" title="画面与外框">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><circle cx="6.5" cy="6.5" r="0.7" fill="currentColor" stroke="none"/></svg>
            <span>画面</span>
          </button>
          <button class="rail-tab-btn" data-tab="zoom" title="自动运镜与缩放">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="M11 8v6M8 11h6"/></svg>
            <span>运镜</span>
          </button>
          <button class="rail-tab-btn" data-tab="opening" title="3D 开场序列">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9L12 3Z"/><path d="M19 16l.8 2.2L22 19l-2.2.8L19 22l-.8-2.2L16 19l2.2-.8L19 16Z"/></svg>
            <span>开场</span>
          </button>
          <button class="rail-tab-btn" data-tab="cursor" title="矢量光标与点击动效">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 3 13 7-5.5 2-2 5.5L5 3Z"/><path d="m12.5 12 4.5 4.5"/></svg>
            <span>光标</span>
          </button>
          <button class="rail-tab-btn" data-tab="camera" title="摄像头画中画">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 8a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2v8a2 2 0 0 0 2 2h8a2 2 0 0 0 2-2v-1.5l5 3v-7l-5 3V8Z"/></svg>
            <span>摄像头</span>
          </button>
          <button class="rail-tab-btn" data-tab="audio" title="系统声与麦克风">
            <svg class="ico" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5 6 9H3v6h3l5 4V5Z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
            <span>声音</span>
          </button>
        </nav>
      </aside>
    </main>

    <!-- 3. Bottom Multi-Track Interactive Timeline (256px) -->
    <section id="studio-timeline" class="timeline-dock"></section>
  </div>

  <!-- Modal Containers (Recording Island & Multi-Spec Export Sheet) -->
  <div id="studio-modal-backdrop" class="modal-backdrop">
    <div id="studio-modal-card" class="modal-card"></div>
  </div>

  <script type="module" src="/web/studio/app.ts"></script>
</body>
</html>
